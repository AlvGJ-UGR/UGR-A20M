# probe_points: 127, 127, 20

# [input_shaper]
# shaper_type_x: mzv            # ← Resultado de SHAPER_CALIBRATE
# shaper_freq_x: 40.0
# shaper_type_y: mzv
# shaper_freq_y: 40.0


# =============================================================================
# 16. NOTAS DE CALIBRACIÓN
# =============================================================================
# Los pasos siguientes deben realizarse en orden tras instalar la electrónica.
#
# A) SERIAL DEL MCU
#    ssh user@orangepi && ls /dev/serial/by-id/
#    Copiar el resultado al campo serial: de [mcu]
#
# B) DIRECCIÓN DE MOTORES
#    Mover cada eje desde Fluidd y verificar que la dirección es correcta.
#    Si algún eje va al revés, añadir/quitar el '!' en dir_pin.
#
# C) CALIBRAR ROTATION_DISTANCE DEL EXTRUSOR
#    1. Calentar hotend a 200 °C
#    2. Marcar el filamento a exactamente 100 mm de la entrada del extrusor
#    3. Ejecutar: G91 → G1 E100 F150
#    4. Medir la distancia real extruida
#    5. nuevo_rd = rotation_distance_actual × distancia_real / 100
#    6. Actualizar rotation_distance y repetir hasta < 1 % de error
#
# D) CALIBRAR PID HOTEND
#    PID_CALIBRATE HEATER=extruder TARGET=220
#    Tras completar: SAVE_CONFIG
#
# E) CALIBRAR PID CAMA
#    PID_CALIBRATE HEATER=heater_bed TARGET=60
#    Tras completar: SAVE_CONFIG
#
# F) MEDIR OFFSETS CR-TOUCH
#    Medir con calibre la distancia física del pin del CR-Touch al nozzle.
#    Actualizar x_offset e y_offset en [bltouch].
#
# G) CALIBRAR Z-OFFSET
#    G28 → PROBE_CALIBRATE → ajustar con TESTZ → ACCEPT → SAVE_CONFIG
#
# H) NIVELAR TORNILLOS DE CAMA
#    G28 → SCREWS_TILT_CALCULATE
#    Ajustar físicamente los tornillos siguiendo las instrucciones en pantalla.
#
# I) GENERAR MESH DE NIVELACIÓN
#    G28 → BED_MESH_CALIBRATE → SAVE_CONFIG
#
# J) CALIBRAR PRESSURE ADVANCE
#    Ver macro PRESSURE_ADVANCE_TOWER en macros.cfg
#
# K) INPUT SHAPING (opcional, mejora velocidad/calidad)
#    Conectar ADXL345 → descomentar sección 13 → SHAPER_CALIBRATE → SAVE_CONFIG
# =============================================================================

#*# <--- SAVE_CONFIG block — Klipper escribe aquí automáticamente al ejecutar SAVE_CONFIG --->
#*# No editar manualmente este bloque.
#*# Los valores de PID, z_offset y bed_mesh se añaden aquí tras calibrar.
