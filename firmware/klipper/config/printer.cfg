# =============================================================================
# printer.cfg — Geeetech A20M modificada
# Proyecto : UGR-A20M (Universidad de Granada)
# Autor    : Álvaro González Jiménez <alvarogj1@correo.ugr.es>
# Placa    : BTT SKR Mini E3 V3.0 (STM32G0B1)
# SBC      : Orange Pi Zero 3 — Armbian + Klipper
# Extrusor : Sharkfin + BMG Clone (direct drive)
# Hotend   : CHC V6 Volcano (NTC 100k Generic 3950)
# Nivelado : CR-Touch
# Toolhead : Mini Stealth v2
# =============================================================================
# ÍNDICE DE SECCIONES
#   1. Includes
#   2. MCU
#   3. Impresora (cinemática y límites)
#   4. Motores paso a paso
#   5. Extrusor
#   6. Cama caliente
#   7. Ventiladores
#   8. CR-Touch y homing seguro
#   9. Nivelación de cama (bed mesh)
#  10. Ajuste de tornillos de cama
#  11. Excluir objetos (cancel object)
#  12. Arcos G2/G3
#  13. Sensor de filamento (opcional)
#  14. Sensores de temperatura del sistema
#  15. Input Shaping (comentado — requiere ADXL345)
#  16. Notas de calibración
# =============================================================================


# -----------------------------------------------------------------------------
# 1. INCLUDES
# -----------------------------------------------------------------------------
[include macros.cfg]


# -----------------------------------------------------------------------------
# 2. MCU
# -----------------------------------------------------------------------------
[mcu]
# Buscar el serial con: ls /dev/serial/by-id/
# Debe parecerse a: usb-Klipper_stm32g0b1xx_XXXXXXXXXXXX-if00
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_XXXXXXXXXX-if00


# -----------------------------------------------------------------------------
# 3. IMPRESORA
# -----------------------------------------------------------------------------
[printer]
kinematics: cartesian
max_velocity: 200              # mm/s — reducir si aparecen pérdidas de pasos
max_accel: 2000                # mm/s² — ajustar tras Input Shaping
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0


# -----------------------------------------------------------------------------
# 4. MOTORES PASO A PASO
# -----------------------------------------------------------------------------

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40          # GT2 20T: 2 mm/diente × 20 dientes = 40 mm
endstop_pin: ^PC0
position_endstop: 0
position_max: 255
homing_speed: 50
homing_retract_dist: 5

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 255
homing_speed: 50
homing_retract_dist: 5

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8           # Husillo T8 — paso 8 mm/vuelta
endstop_pin: probe:z_virtual_endstop
position_min: -5               # Margen negativo necesario para PROBE_CALIBRATE
position_max: 255
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

# Drivers TMC2209 — StealthChop en XY, SpreadCycle en Z y E
[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.650
stealthchop_threshold: 0       # SpreadCycle en Z → mayor precisión

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 0       # SpreadCycle en extrusor → mejor control de flujo


# -----------------------------------------------------------------------------
# 5. EXTRUSOR
# -----------------------------------------------------------------------------
[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
# Sharkfin + BMG Clone (relación ~3.5:1)
# Valor inicial: calibrar con el procedimiento del doc 02_sharkfin_bmg.md
rotation_distance: 22.67       # ← CALIBRAR antes de imprimir
gear_ratio: 50:17              # Relación BMG Clone
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200 # Necesario para LOAD_FILAMENT
heater_pin: PC8
sensor_type: Generic 3950      # NTC 100k — tipo correcto para CHC V6
sensor_pin: PA0
min_temp: 0
max_temp: 285                  # CHC V6 Volcano soporta hasta 300 °C
min_extrude_temp: 170          # Protección: no extruir en frío
# PID → ejecutar: PID_CALIBRATE HEATER=extruder TARGET=220
control: pid
pid_Kp: 21.0                   # ← Reemplazar con valores reales tras calibrar
pid_Ki: 1.25
pid_Kd: 89.0
# Pressure Advance → ajustar con tuning tower
pressure_advance: 0.05         # ← CALIBRAR
pressure_advance_smooth_time: 0.040


# -----------------------------------------------------------------------------
# 6. CAMA CALIENTE
# -----------------------------------------------------------------------------
[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 120
# PID → ejecutar: PID_CALIBRATE HEATER=heater_bed TARGET=60
control: pid
pid_Kp: 54.0                   # ← Reemplazar con valores reales tras calibrar
pid_Ki: 0.77
pid_Kd: 950.0


# -----------------------------------------------------------------------------
# 7. VENTILADORES
# -----------------------------------------------------------------------------

# Ventilador hotend — 2510 24V — activo automáticamente al calentar
[heater_fan hotend_fan]
pin: PC7
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

# Ventiladores de capa — 4010 24V ×2 en paralelo — controlados por slicer
[fan]
pin: PC6
kick_start_time: 0.5           # Arranque suave para ventiladores 24V


# -----------------------------------------------------------------------------
# 8. CR-TOUCH Y HOMING SEGURO
# -----------------------------------------------------------------------------
[bltouch]
sensor_pin: ^PC14
control_pin: PA1
# Medir físicamente con calibre desde el pin del CR-Touch al centro del nozzle
x_offset: -44                  # ← MEDIR y actualizar
y_offset: -9                   # ← MEDIR y actualizar
z_offset: 0                    # ← Calibrar con PROBE_CALIBRATE (se guarda en SAVE_CONFIG)
speed: 5
lift_speed: 10
samples: 2
sample_retract_dist: 3.0
samples_result: median
samples_tolerance: 0.010
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 127, 127     # Centro de la cama (255/2, 255/2)
speed: 80
z_hop: 10
z_hop_speed: 10


# -----------------------------------------------------------------------------
# 9. NIVELACIÓN DE CAMA (BED MESH)
# -----------------------------------------------------------------------------
[bed_mesh]
speed: 150
horizontal_move_z: 5
# mesh_min/max deben compensar los offsets del CR-Touch
mesh_min: 15, 15
mesh_max: 210, 245             # 255 - |x_offset| en X, 255 - |y_offset| en Y
probe_count: 5, 5              # Malla 5×5 = 25 puntos
mesh_pps: 2, 2
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0
fade_target: 0


# -----------------------------------------------------------------------------
# 10. AJUSTE DE TORNILLOS DE CAMA (SCREWS TILT ADJUST)
# -----------------------------------------------------------------------------
# Ayuda a nivelar la cama manualmente midiendo cada tornillo con el CR-Touch.
# Ejecutar con: SCREWS_TILT_CALCULATE
#
# CÓMO CALCULAR LAS COORDENADAS:
# Los valores XY corresponden a la posición del NOZZLE cuando el CR-Touch
# está directamente sobre el tornillo.
# Fórmula: coord_nozzle = posición_tornillo_en_cama - (x_offset, y_offset)
# Ejemplo con x_offset=-44, y_offset=-9:
#   Tornillo en posición física (25, 30) en la cama →
#   screw_X = 25 - (-44) = 69, screw_Y = 30 - (-9) = 39
#
# Para medir la posición física de cada tornillo en la A20M:
# 1. Retirar la cama temporalmente o marcar la posición de cada tornillo
# 2. Medir con calibre desde el borde frontal izquierdo de la cama
# 3. Los tornillos de la A20M están aproximadamente en:
#    Frontal izquierdo:  X≈25mm, Y≈30mm desde la esquina
#    Frontal derecho:    X≈211mm, Y≈30mm
#    Trasero derecho:    X≈211mm, Y≈246mm
#    Trasero izquierdo:  X≈25mm, Y≈246mm
# Ajustar estos valores tras medir físicamente en tu impresora.
[screws_tilt_adjust]
screw1: 69, 39                 # Tornillo frontal izquierdo ← VERIFICAR con tus medidas
screw1_name: Frontal izquierdo
screw2: 255, 39                # Tornillo frontal derecho ← VERIFICAR
screw2_name: Frontal derecho
screw3: 255, 255               # Tornillo trasero derecho ← VERIFICAR
screw3_name: Trasero derecho
screw4: 69, 255                # Tornillo trasero izquierdo ← VERIFICAR
screw4_name: Trasero izquierdo
horizontal_move_z: 10
speed: 100
screw_thread: CW-M4            # Tornillos M4 en sentido horario (estándar A20M)


# -----------------------------------------------------------------------------
# 11. EXCLUIR OBJETOS (CANCEL OBJECT)
# -----------------------------------------------------------------------------
# Permite cancelar objetos individuales durante una impresión multi-pieza.
# Requiere activar "Label objects" en el slicer (PrusaSlicer / OrcaSlicer / Bambu).
[exclude_object]


# -----------------------------------------------------------------------------
# 12. ARCOS G2/G3 (compatibilidad con slicers)
# -----------------------------------------------------------------------------
# Permite que Klipper procese comandos de arco G2/G3 que algunos slicers generan.
# Activar "Arc fitting" en OrcaSlicer/PrusaSlicer para trayectorias más suaves.
[gcode_arcs]
resolution: 0.1   # mm — resolución de interpolación de arcos


# -----------------------------------------------------------------------------
# 13. SENSOR DE FILAMENTO (opcional — descomentar al instalar el sensor)
# -----------------------------------------------------------------------------
# Conectar el sensor al pin PC15 (disponible en SKR Mini E3 V3).
# La macro FILAMENT_RUNOUT está definida en macros.cfg.

# [filament_switch_sensor runout_sensor]
# switch_pin: ^PC15          # Pin con pull-up interno (^)
# pause_on_runout: False     # Gestión manual con la macro FILAMENT_RUNOUT
# runout_gcode: FILAMENT_RUNOUT
# insert_gcode: M117 Filamento detectado
# event_delay: 3.0           # Segundos de espera antes de activar la macro
# pause_delay: 0.5


# -----------------------------------------------------------------------------
# 14. SENSORES DE TEMPERATURA DEL SISTEMA
# -----------------------------------------------------------------------------
[temperature_sensor orange_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 85

[temperature_sensor mcu_skr]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 80


# -----------------------------------------------------------------------------
# 15. INPUT SHAPING (requiere acelerómetro ADXL345 — opcional)
# -----------------------------------------------------------------------------
# Descomentar y ejecutar SHAPER_CALIBRATE tras conectar el ADXL345

# [adxl345]
# cs_pin: PA4
# spi_software_sclk_pin: PA5
# spi_software_mosi_pin: PA7
# spi_software_miso_pin: PA6
# axes_map: x, y, z

# [resonance_tester]
