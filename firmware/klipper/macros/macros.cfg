# =============================================================================
# macros.cfg — UGR-A20M
# Proyecto : UGR-A20M (Universidad de Granada)
# Autor    : Álvaro González Jiménez <alvarogj1@correo.ugr.es>
# =============================================================================
# ÍNDICE
#   1. Impresión    — START_PRINT / END_PRINT
#   2. Flujo        — PAUSE / RESUME / CANCEL_PRINT
#   3. Filamento    — LOAD / UNLOAD / CHANGE / RUNOUT
#   4. Material     — SET_MATERIAL / PREHEAT_* / COOLDOWN
#   5. Calibración  — PID / Z-offset / mesh / tornillos / PA
#   6. Mantenimiento— HOME / PARK / MOTORS / CLEAN / STATUS / STATS
# =============================================================================


# -----------------------------------------------------------------------------
# 1. IMPRESIÓN
# -----------------------------------------------------------------------------
# Start G-code para el slicer:
#   PrusaSlicer / OrcaSlicer:
#     START_PRINT BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature]
#   Cura:
#     START_PRINT BED_TEMP={material_bed_temperature_layer_0} EXTRUDER_TEMP={material_print_temperature_layer_0}
#   Bambu Studio / Orca (Bambu):
#     START_PRINT BED_TEMP=[bed_temperature_initial_layer_single] EXTRUDER_TEMP=[nozzle_temperature_initial_layer]

[gcode_macro START_PRINT]
description: Inicio de impresión — calentar, homing, nivelar y purgar
gcode:
    {% set BED_TEMP      = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    M117 Iniciando UGR-A20M...
    G21             # Unidades métricas
    G90             # Coordenadas absolutas
    M82             # Extrusión absoluta

    # Iniciar calentamiento de cama sin esperar
    M140 S{BED_TEMP}

    # Calentar hotend a temperatura segura para homing (evita rezumar)
    M109 S150

    # Homing completo
    G28

    # Cargar mesh guardado si existe (generado con GENERATE_MESH)
    {% if "default" in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
    {% else %}
        M117 Sin mesh guardado — ejecutar GENERATE_MESH tras la primera impresión
    {% endif %}

    # Esperar temperaturas finales
    M117 Esperando temperatura de cama...
    M190 S{BED_TEMP}
    M117 Esperando temperatura de hotend...
    M109 S{EXTRUDER_TEMP}

    # Línea de purga doble en el borde izquierdo
    M117 Purgando...
    G1 X5 Y20 Z0.3 F5000
    G91
    G1 Y180 E15 F1200
    G1 X0.5 F5000
    G1 Y-180 E15 F1200
    G92 E0
    G90

    M117 Imprimiendo...

[gcode_macro END_PRINT]
description: Fin de impresión — retraer, aparcar y apagar
gcode:
    M117 Finalizando...

    # Retraer para cortar el hilo
    G92 E0
    G1 E-3 F3600

    # Apagar calentadores inmediatamente
    M104 S0
    M140 S0

    # Subir Z y aparcar en esquina trasera izquierda
    G91
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set z_safe = [cur_z + 15, max_z - 1]|min %}
    G1 Z{z_safe - cur_z} F3000
    G90
    G1 X10 Y240 F6000

    # Apagar ventiladores y motores
    M106 S0
    M84

    M117 ¡Completado!


# -----------------------------------------------------------------------------
# 2. CONTROL DE FLUJO
# -----------------------------------------------------------------------------

[gcode_macro PAUSE]
description: Pausar impresión y aparcar el cabezal con safe_z dinámico
rename_existing: BASE_PAUSE
variable_park_x: 10
variable_park_y: 10
variable_z_hop: 10
variable_retract: 1.5
gcode:
    {% set x = params.X|default(printer["gcode_macro PAUSE"].park_x)|float %}
    {% set y = params.Y|default(printer["gcode_macro PAUSE"].park_y)|float %}
    {% set z = params.Z|default(printer["gcode_macro PAUSE"].z_hop)|float %}
    {% set e = params.E|default(printer["gcode_macro PAUSE"].retract)|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set safe_z = [cur_z + z, max_z - 1]|min %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{e} F2100
    G1 Z{safe_z - cur_z} F900
    G90
    G1 X{x} Y{y} F6000
    M117 En pausa...

[gcode_macro RESUME]
description: Reanudar desde la posición de pausa
rename_existing: BASE_RESUME
gcode:
    {% set e = params.E|default(1.5)|float %}
    G91
    G1 E{e} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME
    M117 Imprimiendo...

[gcode_macro CANCEL_PRINT]
description: Cancelar la impresión en curso
rename_existing: BASE_CANCEL_PRINT
gcode:
    END_PRINT
    BASE_CANCEL_PRINT
    M117 Cancelado


# -----------------------------------------------------------------------------
# 3. FILAMENTO
# -----------------------------------------------------------------------------

[gcode_macro LOAD_FILAMENT]
description: Cargar filamento — uso: LOAD_FILAMENT [TEMP=200]
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M117 Cargando filamento...
    M109 S{TEMP}
    G91
    G1 E60 F400     # Avance rápido hasta el hotend
    G1 E30 F150     # Purga lenta
    G92 E0
    G90
    M117 Filamento cargado — revisar purga

[gcode_macro UNLOAD_FILAMENT]
description: Descargar filamento — uso: UNLOAD_FILAMENT [TEMP=200]
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M117 Descargando filamento...
    M109 S{TEMP}
    G91
    G1 E5  F300     # Pequeña purga para limpiar punta
    G1 E-8 F3600    # Retracción rápida para romper hilo
    G1 E-80 F800    # Retirada lenta del hotend
    G92 E0
    G90
    M117 Filamento descargado

[gcode_macro CHANGE_FILAMENT]
description: Pausa guiada para cambio de filamento — uso: CHANGE_FILAMENT [TEMP=200]
gcode:
    {% set TEMP = params.TEMP|default(printer.extruder.temperature)|float %}
    M117 Cambio de filamento...
    PAUSE
    UNLOAD_FILAMENT TEMP={TEMP}
    M117 Insertar nuevo filamento y ejecutar RESUME

[gcode_macro FILAMENT_RUNOUT]
description: Acción automática cuando se acaba el filamento (sensor)
gcode:
    M117 ¡Filamento agotado!
    { action_respond_info("AVISO: Filamento agotado — recargar y ejecutar RESUME") }
    PAUSE
    M117 Recargar filamento y ejecutar RESUME
# Para activar el sensor físico de filamento:
# 1. Conectar sensor al pin PC15 de la SKR (ver pinout_skr_mini_e3_v3.md)
# 2. Descomentar la sección [filament_switch_sensor] en printer.cfg
# Nota: M300 no existe en Klipper sin buzzer — se usa action_respond_info


# -----------------------------------------------------------------------------
# 4. MATERIAL — precalentamiento y ajuste de parámetros
# -----------------------------------------------------------------------------

[gcode_macro SET_MATERIAL]
description: Ajustar parámetros de impresión por material en caliente
# Uso: SET_MATERIAL MATERIAL=PLA
# Materiales disponibles: PLA, PETG, ABS, ASA, TPU
gcode:
    {% set MATERIAL = params.MATERIAL|default("PLA")|upper %}
    {% if MATERIAL == "PLA" %}
        SET_PRESSURE_ADVANCE ADVANCE=0.05
        SET_VELOCITY_LIMIT VELOCITY=200 ACCEL=2000
        M117 Material: PLA
    {% elif MATERIAL == "PETG" %}
        SET_PRESSURE_ADVANCE ADVANCE=0.08
        SET_VELOCITY_LIMIT VELOCITY=150 ACCEL=1500
        M117 Material: PETG
    {% elif MATERIAL == "ABS" or MATERIAL == "ASA" %}
        SET_PRESSURE_ADVANCE ADVANCE=0.04
        SET_VELOCITY_LIMIT VELOCITY=120 ACCEL=1500
        M117 Material: {MATERIAL}
    {% elif MATERIAL == "TPU" %}
        SET_PRESSURE_ADVANCE ADVANCE=0.01
        SET_VELOCITY_LIMIT VELOCITY=40 ACCEL=500
        M117 Material: TPU
    {% else %}
        M117 Material desconocido: {MATERIAL}
    {% endif %}

[gcode_macro PREHEAT_PLA]
description: Precalentar para PLA (hotend 215°C, cama 60°C)
gcode:
    M140 S60
    M104 S215
    M117 Precalentando PLA...

[gcode_macro PREHEAT_PETG]
description: Precalentar para PETG (hotend 235°C, cama 80°C)
gcode:
    M140 S80
    M104 S235
    M117 Precalentando PETG...

[gcode_macro PREHEAT_ABS]
description: Precalentar para ABS/ASA (hotend 250°C, cama 100°C)
gcode:
    M140 S100
    M104 S250
    M117 Precalentando ABS/ASA...

[gcode_macro PREHEAT_TPU]
description: Precalentar para TPU (hotend 225°C, cama 35°C)
gcode:
    M140 S35
    M104 S225
    M117 Precalentando TPU...

[gcode_macro COOLDOWN]
description: Apagar todos los calentadores y ventiladores
gcode:
    M104 S0
    M140 S0
    M106 S0
    M117 Enfriando...


# -----------------------------------------------------------------------------
# 5. CALIBRACIÓN
# -----------------------------------------------------------------------------

[gcode_macro CALIBRATE_PID_HOTEND]
description: Calibrar PID del hotend — uso: CALIBRATE_PID_HOTEND [TEMP=220]
gcode:
    {% set TEMP = params.TEMP|default(220)|float %}
    M117 Calibrando PID hotend a {TEMP}°C...
    PID_CALIBRATE HEATER=extruder TARGET={TEMP}
    M117 PID hotend listo — ejecutar SAVE_CONFIG

[gcode_macro CALIBRATE_PID_BED]
description: Calibrar PID de la cama — uso: CALIBRATE_PID_BED [TEMP=60]
gcode:
    {% set TEMP = params.TEMP|default(60)|float %}
    M117 Calibrando PID cama a {TEMP}°C...
    PID_CALIBRATE HEATER=heater_bed TARGET={TEMP}
    M117 PID cama listo — ejecutar SAVE_CONFIG

[gcode_macro CALIBRATE_Z_OFFSET]
description: Calibrar z_offset del CR-Touch con método del papel
gcode:
    M117 Calibrando z_offset...
    G28
    PROBE_CALIBRATE
    M117 Ajustar con TESTZ → ACCEPT → SAVE_CONFIG

[gcode_macro LEVEL_BED_SCREWS]
description: Guía interactiva de nivelación de tornillos de cama
gcode:
    M117 Nivelando tornillos...
    G28
    SCREWS_TILT_CALCULATE
    M117 Ajustar tornillos y repetir si diferencia > 0.1 mm

[gcode_macro GENERATE_MESH]
description: Generar mesh de nivelación 5×5 y guardarlo como perfil 'default'
gcode:
    M117 Generando mesh 5x5...
    G28
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=default
    SAVE_CONFIG

[gcode_macro PRESSURE_ADVANCE_TOWER]
description: Iniciar torre de calibración de Pressure Advance
gcode:
    M117 Torre Pressure Advance...
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE \
        START=0 FACTOR=0.005 BAND=5
    M117 Ver docs/guia_calibracion.md paso 9

[gcode_macro CALIBRATE_INPUT_SHAPING]
description: Iniciar calibración de Input Shaping (requiere ADXL345 conectado)
gcode:
    M117 Calibrando Input Shaping...
    G28
    SHAPER_CALIBRATE
    M117 IS calibrado — ejecutar SAVE_CONFIG


# -----------------------------------------------------------------------------
# 6. MANTENIMIENTO
# -----------------------------------------------------------------------------

[gcode_macro HOME_ALL]
description: Homing completo de todos los ejes
gcode:
    G28
    M117 Homing completado

[gcode_macro PARK]
description: Aparcar en posición de mantenimiento (centro de la cama, Z=150)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X127 Y127 Z150 F6000
    M117 Aparcado

[gcode_macro MOTORS_OFF]
description: Desactivar todos los motores
gcode:
    M84
    M117 Motores desactivados

[gcode_macro CLEAN_NOZZLE]
description: Calentar y purgar para limpiar la boquilla — uso: CLEAN_NOZZLE [TEMP=220]
gcode:
    {% set TEMP = params.TEMP|default(220)|float %}
    M117 Calentando para limpiar boquilla...
    M109 S{TEMP}
    G91
    G1 E8 F150      # Purgar
    G1 E-3 F3600    # Retraer para cortar hilo
    G90
    M117 Limpiar la boquilla manualmente

[gcode_macro STATUS]
description: Mostrar estado completo de la impresora en la consola
gcode:
    {% set etemp   = printer.extruder.temperature|round(1) %}
    {% set etarget = printer.extruder.target|round(1) %}
    {% set btemp   = printer.heater_bed.temperature|round(1) %}
    {% set btarget = printer.heater_bed.target|round(1) %}
    {% set pos     = printer.toolhead.position %}
    {% set fan     = (printer.fan.speed * 100)|round(0)|int %}
    { action_respond_info(
        "════════ UGR-A20M STATUS ════════\n"
        ~ "Hotend : %.1f °C  (target: %.1f °C)\n" | format(etemp, etarget)
        ~ "Cama   : %.1f °C  (target: %.1f °C)\n" | format(btemp, btarget)
        ~ "Ventil.: %d%%\n" | format(fan)
        ~ "Posición: X=%.1f  Y=%.1f  Z=%.3f\n" | format(pos.x, pos.y, pos.z)
        ~ "════════════════════════════════"
    ) }

[gcode_macro PRINT_STATS]
description: Mostrar estadísticas del trabajo de impresión actual
gcode:
    {% if printer.print_stats.state == "printing" %}
        {% set progress = (printer.display_status.progress * 100)|round(1) %}
        {% set elapsed  = printer.print_stats.total_duration|int %}
        {% set h = (elapsed // 3600) %}
        {% set m = ((elapsed % 3600) // 60) %}
        { action_respond_info(
            "Trabajo : " ~ printer.print_stats.filename ~ "\n"
            ~ "Progreso: " ~ progress ~ "%\n"
            ~ "Tiempo  : " ~ h ~ "h " ~ m ~ "min\n"
            ~ "Filamento usado: " ~ (printer.print_stats.filament_used / 1000)|round(2) ~ " m"
        ) }
    {% else %}
        { action_respond_info("No hay impresión en curso.") }
    {% endif %}

[gcode_macro NOZZLE_CHANGE]
description: Procedimiento guiado para cambiar la boquilla
gcode:
    {% set TEMP = params.TEMP|default(250)|float %}
    M117 Preparando cambio de boquilla...
    PARK
    M109 S{TEMP}
    { action_respond_info("Hotend a %.0f°C. Retirar boquilla con llave de 7mm. USAR GUANTES." | format(TEMP)) }
    M117 A {TEMP}°C — usar guantes
