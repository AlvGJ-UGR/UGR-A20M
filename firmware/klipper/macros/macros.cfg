# =============================================================================
# macros.cfg — UGR-A20M
# Proyecto : UGR-A20M (Universidad de Granada)
# Autor    : Álvaro González Jiménez <alvarogj1@correo.ugr.es>
# =============================================================================
# ÍNDICE
#   1. Impresión — START_PRINT / END_PRINT
#   2. Control de flujo — PAUSE / RESUME / CANCEL_PRINT
#   3. Filamento — LOAD_FILAMENT / UNLOAD_FILAMENT
#   4. Calibración — PID, Z-offset, mesh, tornillos, PA
#   5. Mantenimiento — homing, motores, limpieza boquilla
#   6. Información — STATUS
# =============================================================================


# -----------------------------------------------------------------------------
# 1. IMPRESIÓN
# -----------------------------------------------------------------------------

# Configuración en el slicer (campo "Start G-code"):
#   PrusaSlicer / OrcaSlicer:
#     START_PRINT BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature]
#   Cura:
#     START_PRINT BED_TEMP={material_bed_temperature_layer_0} EXTRUDER_TEMP={material_print_temperature_layer_0}

[gcode_macro START_PRINT]
description: Inicio de impresión — calentar, hacer homing, nivelar y purgar
gcode:
    {% set BED_TEMP      = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    M117 Iniciando...
    G21             # Unidades métricas
    G90             # Coordenadas absolutas
    M82             # Extrusión absoluta

    # Iniciar calentamiento de cama sin bloquear
    M140 S{BED_TEMP}

    # Calentar hotend a temperatura segura para homing (evita rezumar en frío)
    M109 S150

    # Homing completo
    G28

    # Ajustar tornillos de cama si la cama estaba fría (primera impresión del día)
    # SCREWS_TILT_CALCULATE   # Descomentar si se quiere ajuste manual cada vez

    # Nivelar con mesh (usa el mesh guardado si existe, o genera uno nuevo)
    BED_MESH_PROFILE LOAD=default

    # Esperar temperatura de cama
    M117 Calentando cama...
    M190 S{BED_TEMP}

    # Calentar hotend a temperatura final
    M117 Calentando hotend...
    M109 S{EXTRUDER_TEMP}

    # Purge line — línea de purga en el borde izquierdo de la cama
    M117 Purgando...
    G1 X5 Y20 Z0.3 F5000
    G91
    G1 Y180 E15 F1200
    G1 X0.5 F5000
    G1 Y-180 E15 F1200
    G92 E0
    G90

    M117 Imprimiendo...

[gcode_macro END_PRINT]
description: Fin de impresión — retraer, aparcar y apagar
gcode:
    M117 Finalizando...

    # Retraer filamento para evitar goteo
    G92 E0
    G1 E-3 F3600

    # Apagar calentadores inmediatamente
    M104 S0
    M140 S0

    # Subir Z (relativo) y aparcar en la esquina trasera
    G91
    G1 Z15 F3000
    G90
    G1 X10 Y240 F6000

    # Apagar ventiladores y motores
    M106 S0
    M84

    M117 ¡Impresión completada!


# -----------------------------------------------------------------------------
# 2. CONTROL DE FLUJO
# -----------------------------------------------------------------------------

[gcode_macro PAUSE]
description: Pausar impresión y aparcar el cabezal
rename_existing: BASE_PAUSE
variable_park_x: 10
variable_park_y: 10
variable_park_z_hop: 10
variable_retract: 1.5
gcode:
    {% set x   = params.X|default(printer["gcode_macro PAUSE"].park_x)|float %}
    {% set y   = params.Y|default(printer["gcode_macro PAUSE"].park_y)|float %}
    {% set z   = params.Z|default(printer["gcode_macro PAUSE"].park_z_hop)|float %}
    {% set e   = params.E|default(printer["gcode_macro PAUSE"].retract)|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set safe_z = [cur_z + z, max_z]|min %}

    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{e} F2100
    G90
    G1 Z{safe_z} F900
    G1 X{x} Y{y} F6000
    M117 En pausa — esperando...

[gcode_macro RESUME]
description: Reanudar impresión desde la posición de pausa
rename_existing: BASE_RESUME
gcode:
    {% set e = params.E|default(1.5)|float %}
    G91
    G1 E{e} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME
    M117 Imprimiendo...

[gcode_macro CANCEL_PRINT]
description: Cancelar impresión en curso
rename_existing: BASE_CANCEL_PRINT
gcode:
    END_PRINT
    BASE_CANCEL_PRINT
    M117 Impresión cancelada


# -----------------------------------------------------------------------------
# 3. FILAMENTO
# -----------------------------------------------------------------------------

[gcode_macro LOAD_FILAMENT]
description: Cargar filamento — uso: LOAD_FILAMENT [TEMP=200]
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M117 Cargando filamento...
    M109 S{TEMP}
    G91
    G1 E60 F400     # Avance rápido hasta el hotend
    G1 E30 F150     # Purga lenta para expulsar el material anterior
    G92 E0
    G90
    M117 Filamento cargado — revisar purga

[gcode_macro UNLOAD_FILAMENT]
description: Descargar filamento — uso: UNLOAD_FILAMENT [TEMP=200]
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M117 Descargando filamento...
    M109 S{TEMP}
    G91
    G1 E5  F300     # Pequeña purga para limpiar la punta
    G1 E-8 F3600    # Retracción rápida para romper el hilo
    G1 E-80 F800    # Retirada lenta fuera del hotend
    G92 E0
    G90
    M117 Filamento descargado — retirar del extrusor

[gcode_macro CHANGE_FILAMENT]
description: Pausa guiada para cambio de filamento
gcode:
    M117 Cambio de filamento...
    PAUSE
    UNLOAD_FILAMENT
    M117 Insertar nuevo filamento y ejecutar RESUME


# -----------------------------------------------------------------------------
# 4. CALIBRACIÓN
# -----------------------------------------------------------------------------

[gcode_macro CALIBRATE_PID_HOTEND]
description: Calibrar PID del hotend — uso: CALIBRATE_PID_HOTEND [TEMP=220]
gcode:
    {% set TEMP = params.TEMP|default(220)|float %}
    M117 Calibrando PID hotend a {TEMP}°C...
    PID_CALIBRATE HEATER=extruder TARGET={TEMP}
    M117 PID hotend OK — ejecutar SAVE_CONFIG

[gcode_macro CALIBRATE_PID_BED]
description: Calibrar PID de la cama — uso: CALIBRATE_PID_BED [TEMP=60]
gcode:
    {% set TEMP = params.TEMP|default(60)|float %}
    M117 Calibrando PID cama a {TEMP}°C...
    PID_CALIBRATE HEATER=heater_bed TARGET={TEMP}
    M117 PID cama OK — ejecutar SAVE_CONFIG

[gcode_macro CALIBRATE_Z_OFFSET]
description: Calibrar z_offset del CR-Touch
gcode:
    M117 Calibrando z_offset...
    G28
    PROBE_CALIBRATE
    M117 Ajustar con TESTZ → ACCEPT → SAVE_CONFIG

[gcode_macro LEVEL_BED_SCREWS]
description: Guía de nivelación manual de tornillos de cama
gcode:
    M117 Nivelando tornillos...
    G28
    SCREWS_TILT_CALCULATE
    M117 Ajustar tornillos y repetir si es necesario

[gcode_macro GENERATE_MESH]
description: Generar y guardar mesh de nivelación de cama
gcode:
    M117 Generando mesh...
    G28
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=default
    SAVE_CONFIG
    M117 Mesh generado y guardado

[gcode_macro PRESSURE_ADVANCE_TOWER]
description: Torre de calibración de Pressure Advance
gcode:
    M117 Torre Pressure Advance...
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE \
        START=0 FACTOR=0.005 BAND=5
    # Instrucciones:
    # 1. Imprimir la torre (usar el modelo de Klipper o un cubo simple)
    # 2. Medir la capa donde las esquinas se ven mejor
    # 3. PA = altura_medida × 0.005
    # 4. Actualizar pressure_advance en printer.cfg


# -----------------------------------------------------------------------------
# 5. MANTENIMIENTO
# -----------------------------------------------------------------------------

[gcode_macro HOME_ALL]
description: Homing completo de todos los ejes
gcode:
    G28
    M117 Homing completado

[gcode_macro PARK]
description: Aparcar el cabezal en posición de mantenimiento (centro, Z alto)
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G90
    G1 X127 Y127 Z150 F6000
    M117 Aparcado

[gcode_macro MOTORS_OFF]
description: Desactivar todos los motores
gcode:
    M84
    M117 Motores desactivados

[gcode_macro CLEAN_NOZZLE]
description: Rutina de limpieza de boquilla (calor + retracción)
gcode:
    {% set TEMP = params.TEMP|default(220)|float %}
    M117 Limpiando boquilla...
    M109 S{TEMP}
    G91
    G1 E5 F150      # Purgar un poco
    G1 E-2 F3600    # Retraer para cortar el hilo
    G90
    M117 Limpiar manualmente la boquilla y ejecutar MOTORS_OFF

[gcode_macro PREHEAT_PLA]
description: Precalentar para PLA (hotend 200°C, cama 60°C)
gcode:
    M140 S60
    M104 S200
    M117 Precalentando para PLA...

[gcode_macro PREHEAT_ABS]
description: Precalentar para ABS/ASA (hotend 250°C, cama 100°C)
gcode:
    M140 S100
    M104 S250
    M117 Precalentando para ABS/ASA...

[gcode_macro PREHEAT_PETG]
description: Precalentar para PETG (hotend 235°C, cama 80°C)
gcode:
    M140 S80
    M104 S235
    M117 Precalentando para PETG...

[gcode_macro COOLDOWN]
description: Apagar todos los calentadores y ventiladores
gcode:
    M104 S0
    M140 S0
    M106 S0
    M117 Enfriando...


# -----------------------------------------------------------------------------
# 6. INFORMACIÓN
# -----------------------------------------------------------------------------

[gcode_macro STATUS]
description: Mostrar estado actual de la impresora en consola
gcode:
    {% set etemp  = printer.extruder.temperature|round(1) %}
    {% set etarget = printer.extruder.target|round(1) %}
    {% set btemp  = printer.heater_bed.temperature|round(1) %}
    {% set btarget = printer.heater_bed.target|round(1) %}
    {% set pos    = printer.toolhead.position %}
    { action_respond_info(
        "=== UGR-A20M STATUS ===\n"
        ~ "Hotend : " ~ etemp ~ " °C (target: " ~ etarget ~ " °C)\n"
        ~ "Cama   : " ~ btemp ~ " °C (target: " ~ btarget ~ " °C)\n"
        ~ "Posición: X=%.1f Y=%.1f Z=%.3f" | format(pos.x, pos.y, pos.z)
    ) }
